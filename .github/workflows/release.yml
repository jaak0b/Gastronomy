name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Require a successful Build & test run for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runs = @(gh run list --workflow "Build & test" --commit "${{ github.sha }}" --limit 1 --json conclusion,status | ConvertFrom-Json)
          if ($runs.Count -ne 1 -or $runs[0].status -ne 'completed' -or $runs[0].conclusion -ne 'success') {
            Write-Error "The Build & test workflow has not succeeded for commit ${{ github.sha }}."
            exit 1
          }

      - name: Build the installer and publish the release
        run: pwsh ./build.ps1 --target Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
