<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GastronomyApp</title>
    <script>
      (function () {
        var path = window.location.pathname.toLowerCase()
        if (path === '/admin' || path.indexOf('/admin/') === 0) {
          return
        }
        if (sessionStorage.getItem('arrivedThroughTheDoor') === 'yes') {
          sessionStorage.removeItem('arrivedThroughTheDoor')
          return
        }
        sessionStorage.setItem('theDoorTarget', window.location.pathname + window.location.search + window.location.hash)
        window.location.replace('/door.html?n=10&v=' + encodeURIComponent(document.lastModified || ''))
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
