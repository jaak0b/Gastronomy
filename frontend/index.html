<!doctype html>
<html lang="de">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GastronomyApp</title>
    <script>
      (function () {
        if (sessionStorage.getItem('arrivedThroughTheDoor') === 'yes') {
          sessionStorage.removeItem('arrivedThroughTheDoor')
          return
        }
        if (sessionStorage.getItem('theDoorAnchor') === 'yes') {
          window.location.assign('/door.html?n=10&v=' + encodeURIComponent(document.lastModified || ''))
        }
      })()
    </script>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
