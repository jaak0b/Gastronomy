<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GastronomyApp</title>
    <script>
      (function () {
        function opensANewAddress() {
          var timing = window.performance
          var entries = timing && timing.getEntriesByType ? timing.getEntriesByType('navigation') : []
          if (entries.length > 0) {
            return entries[0].type === 'navigate'
          }
          return Boolean(timing && timing.navigation && timing.navigation.type === 0)
        }

        if (sessionStorage.getItem('arrivedThroughTheDoor') === 'yes') {
          sessionStorage.removeItem('arrivedThroughTheDoor')
          return
        }
        if (sessionStorage.getItem('theDoorAnchor') !== 'yes' || opensANewAddress()) {
          return
        }
        var anchorAddress = sessionStorage.getItem('theDoorAnchorAddress')
        var address = window.location.pathname + window.location.search + window.location.hash
        if (anchorAddress === null || anchorAddress === address) {
          window.location.assign('/door.html?n=10&v=' + encodeURIComponent(document.lastModified || ''))
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
