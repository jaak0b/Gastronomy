<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>GastronomyApp</title>
    <script>
      window.addEventListener('pageshow', function () {
        setTimeout(function () {
          var parameters = new URLSearchParams(window.location.search)
          var target = sessionStorage.getItem('theDoorTarget') || '/'
          var remaining = Number(parameters.get('n') || '0')
          var build = parameters.get('v') || ''
          if (remaining > 1) {
            window.location.assign('/door.html?n=' + (remaining - 1) + '&v=' + encodeURIComponent(build))
            return
          }
          sessionStorage.setItem('arrivedThroughTheDoor', 'yes')
          window.location.assign(target)
        }, 0)
      })
    </script>
  </head>
  <body></body>
</html>
